<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Project request</title></head>
<body>
  <form name="project-request" method="POST" data-netlify="true" netlify-honeypot="company">
    <input type="hidden" name="form-name" value="project-request">
    <input type="hidden" name="subject" value="New project request from portfolio website">
    <input type="text" name="company">
    <input type="text" name="name">
    <input type="tel" name="phone">
    <input type="email" name="email">
    <input type="text" name="service">
    <textarea name="details"></textarea>
  </form>
</body>
</html>
